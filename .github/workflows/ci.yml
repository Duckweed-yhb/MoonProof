name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      # native 是完整交付路径：C FFI（进程执行 / 文件系统）只在这个后端可用，
      # 因此 CLI（cmd/moonproof）与 platform/*、exec/*、features/run 都声明 native。
      - name: Build (native)
        run: moon build --target native

      - name: Test (native)
        run: moon test --target native

      # 库核心（extract/synth/diagnose/features/report）是纯计算，不 import 任何
      # C FFI 包，声明 supported_targets 覆盖全部四个后端。工具链会按声明
      # 自动排除 native 层，证明"可移植的库"是构建期可验证的事实。
      # 三步刻意分开写：windows-latest 上合并多行 run 块会走 PowerShell。
      - name: Test library core (wasm)
        run: moon test --target wasm

      - name: Test library core (wasm-gc)
        run: moon test --target wasm-gc

      - name: Test library core (js)
        run: moon test --target js

      # 自举（dogfooding）：用 MoonProof 自己验证仓库里的文档代码块
      # （examples/sample.md + README 的快速开始示例）。任一示例腐坏 → CI 红灯。
      - name: Dogfood - verify own docs
        run: moon run --target native cmd/moonproof -- .
